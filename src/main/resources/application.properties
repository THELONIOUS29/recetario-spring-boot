# ==================================================

# CONFIGURACIÓN GENERAL

# ==================================================

server.port=8081



# Ruta de carga de imágenes (en Windows)

upload.path=${UPLOAD_PATH:./uploads}



# Tamaño máximo de archivos

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB





# ==================================================

# CONFIGURACIÓN DE BASE DE DATOS - POSTGRESQL

# ==================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recetas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}


# Dialecto para Hibernate

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# Actualiza las tablas automáticamente

spring.jpa.hibernate.ddl-auto=update



# Muestra consultas SQL en la consola (opcional)

spring.jpa.show-sql=true



# Desactiva inicialización automática si no usas scripts .sql

spring.datasource.initialization-mode=never


spring.h2.console.enabled=false
